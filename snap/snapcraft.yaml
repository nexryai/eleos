name: eleos
title: eleos
base: core24
# Derive the version from git: tags give the release version, commits on
# main give a unique version for edge builds.
version: git
summary: Yet another human-friendly firewall
description: |
  eleos is a lightweight, simple, secure and essential firewall.

  This snap runs strictly confined. The privileged firewall-control
  interface has to be connected manually before rules can be applied:

      sudo snap connect eleos:firewall-control

  Configuration lives in /var/snap/eleos/current/eleos.yml.
  Edit it, then enable the boot service with:

      sudo snap start --enable eleos.daemon

  The service applies rules once and exits. After configuration changes, run
  sudo eleos.elctl apply.
license: MIT
website: https://github.com/nexryai/eleos
contact: https://github.com/nexryai/eleos/issues
issues: https://github.com/nexryai/eleos/issues
source-code: https://github.com/nexryai/eleos

grade: stable
confinement: strict

platforms:
  amd64:
  arm64:
  riscv64:

apps:
  elctl:
    command: bin/elctl-cli
    plugs:
      - firewall-control
  daemon:
    # Keep the service name so refreshes preserve its enabled/disabled state.
    command: bin/elctl-cli enable
    daemon: oneshot
    # firewall-control requires a manual connection before the first start.
    install-mode: disable
    # A stop command makes snapd set RemainAfterExit=yes for oneshot services.
    stop-command: bin/elctl-cli disable
    reload-command: bin/elctl-cli apply
    plugs:
      - firewall-control

parts:
  eleos:
    # Use the nil plugin and build manually: the go plugin validates the
    # compiler version, which fails when GOTOOLCHAIN=auto has to download a
    # newer toolchain (the validation parses the "go: downloading ..." line).
    plugin: nil
    source: .
    build-packages:
      - git
      - golang-go
    build-attributes:
      - no-patchelf
    override-build: |
      cd "$SNAPCRAFT_PART_SRC"
      export CGO_ENABLED=0
      export GOTOOLCHAIN=auto
      go build -buildvcs=false -trimpath -ldflags="-s -w" \
        -o "$SNAPCRAFT_PART_INSTALL/bin/elctl" .

  wrappers:
    plugin: dump
    source: snap/local
    organize:
      elctl-cli: bin/elctl-cli

  config:
    plugin: nil
    override-build: |
      install -Dm0644 "$SNAPCRAFT_PROJECT_DIR/config.default.yml" \
        "$SNAPCRAFT_PART_INSTALL/default-config.yml"
