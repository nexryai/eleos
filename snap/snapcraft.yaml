name: eleos
title: eleos
base: core24
# Derive the version from git: tags give the release version, commits on
# main give a unique version for edge builds.
version: git
summary: Lightweight nftables firewall that operates via netlink
description: |
  eleos is a lightweight, simple, secure and essential firewall that
  manipulates nftables directly through netlink. It does not depend on the
  nft(8) command and needs no external API access to generate or apply rules.

  This snap runs strictly confined. The privileged firewall-control
  interface has to be connected manually before rules can be applied:

      sudo snap connect eleos:firewall-control

  Configuration lives in /var/snap/eleos/current/eleos.yml.
license: MIT
website: https://github.com/nexryai/eleos
contact: https://github.com/nexryai/eleos/issues
issues: https://github.com/nexryai/eleos/issues
source-code: https://github.com/nexryai/eleos

grade: stable
confinement: strict

platforms:
  amd64:
  arm64:
  riscv64:

apps:
  elctl:
    command: bin/elctl-cli
    plugs:
      - firewall-control
  daemon:
    command: bin/daemon
    daemon: simple
    plugs:
      - firewall-control

parts:
  eleos:
    plugin: go
    source: .
    build-packages:
      - golang-go
    build-attributes:
      - no-patchelf
    override-build: |
      export CGO_ENABLED=0
      export GOTOOLCHAIN=auto
      go build -buildvcs=false -trimpath -ldflags="-s -w" \
        -o "$SNAPCRAFT_PART_INSTALL/bin/elctl" .

  wrappers:
    plugin: dump
    source: snap/local
    organize:
      elctl-cli: bin/elctl-cli
      daemon: bin/daemon

  config:
    plugin: nil
    override-build: |
      install -Dm0644 "$SNAPCRAFT_PROJECT_DIR/config.default.yml" \
        "$SNAPCRAFT_PART_INSTALL/default-config.yml"
