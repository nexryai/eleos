name: Integration Tests

on:
  pull_request:
    types:
      - opened
      - synchronize
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: Run against real nftables
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # nftablesの操作にはCAP_NET_ADMINが必要で、さらに検証用のveth/ネットワーク
    # 名前空間の作成には特権が必要なため--privilegedでコンテナを起動する。
    # コンテナは自身のネットワーク名前空間を持つので、ランナー(VM)本体の
    # ネットワークには影響しない。
    container:
      image: golang:1.27.3
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Install test dependencies
        run: |
          apt-get update
          apt-get install -y nftables iproute2 iputils-ping
          nft --version
          uname -r

      - name: Build elctl
        run: CGO_ENABLED=0 go build -o elctl main.go

      - name: Run nftables integration tests
        env:
          ELCTL_BIN: ${{ github.workspace }}/elctl
        run: go test -tags integration -v -count=1 -timeout 10m ./integration/...

  systemd:
    name: Native systemd service
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y nftables
      - name: Build binary and integration tests
        run: |
          CGO_ENABLED=0 go build -o elctl .
          CGO_ENABLED=0 go test -tags integration -c -o integration.test ./integration
      - name: Test installed systemd service
        run: sudo env ELEOS_SERVICE_TEST=systemd ELCTL_BIN="$GITHUB_WORKSPACE/elctl" ./integration.test -test.run '^TestSystemdService$' -test.v -test.timeout 10m

  snap:
    name: Strictly confined Snap
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y nftables snapd
      - name: Build snap
        id: build
        uses: snapcore/action-build@v1
      - name: Build integration tests
        run: CGO_ENABLED=0 go test -tags integration -c -o integration.test ./integration
      - name: Test installed Snap
        env:
          ELEOS_SNAP_FILE: ${{ steps.build.outputs.snap }}
        run: sudo env ELEOS_SERVICE_TEST=snap ELEOS_SNAP_FILE="$ELEOS_SNAP_FILE" ./integration.test -test.run '^TestSnapService$' -test.v -test.timeout 15m
