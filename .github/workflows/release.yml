name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.8.6)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'

      - name: Build
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o elctl-amd64 main.go
          GOOS=linux GOARCH=arm CGO_ENABLED=0 go build -o elctl-arm main.go
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o elctl-arm64 main.go
          GOOS=linux GOARCH=mips CGO_ENABLED=0 go build -o elctl-mips main.go
          GOOS=linux GOARCH=mips64 CGO_ENABLED=0 go build -o elctl-mips64 main.go
          GOOS=linux GOARCH=riscv64 CGO_ENABLED=0 go build -o elctl-riscv64 main.go
          GOOS=linux GOARCH=ppc64 CGO_ENABLED=0 go build -o elctl-ppc64 main.go
          GOOS=linux GOARCH=ppc64le CGO_ENABLED=0 go build -o elctl-ppc64le main.go
          GOOS=linux GOARCH=s390x CGO_ENABLED=0 go build -o elctl-s390x main.go

      - name: Build Debian packages
        run: |
          version="${RELEASE_TAG#v}"
          packaging/deb/build-deb.sh amd64 elctl-amd64 "$version" dist
          packaging/deb/build-deb.sh arm64 elctl-arm64 "$version" dist

      - name: Compress with zip
        run: |
          for arch in amd64 arm arm64 mips mips64 riscv64 ppc64 ppc64le s390x; do
            zip -j "eleos-linux-$arch.zip" "elctl-$arch"
          done

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              eleos-linux-*.zip dist/*.deb --clobber
          else
            gh release create "$RELEASE_TAG" \
              --title "eleos $RELEASE_TAG" \
              --generate-notes \
              eleos-linux-*.zip dist/*.deb
          fi

  arch:
    name: Build Arch package (${{ matrix.arch }})
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86_64
          - aarch64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Build package
        run: |
          version="${RELEASE_TAG#v}"
          docker run --rm \
            --volume "$PWD:/work" \
            --workdir /work \
            archlinux:latest \
            bash -c "pacman -Syu --noconfirm --needed base-devel go curl git >/dev/null && packaging/arch/build.sh '$version' '${{ matrix.arch }}' dist"

      - name: Upload package to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          assets=(dist/*.pkg.tar.zst)
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber

  packaging:
    name: Update packaging metadata
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update PKGBUILD, .SRCINFO and spec
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG#v}"
          pkgver="${tag//-/_}"
          url="https://github.com/nexryai/eleos/archive/refs/tags/v${tag}.tar.gz"

          tmp="$(mktemp)"
          curl -fsSL --retry 3 "$url" -o "$tmp"
          sha="$(sha256sum "$tmp" | cut -d' ' -f1)"
          rm -f "$tmp"

          sed -E -i \
            -e "s/^pkgver=.*/pkgver=${pkgver}/" \
            -e "s/^pkgrel=.*/pkgrel=1/" \
            -e "s/^sha256sums=.*/sha256sums=('${sha}')/" \
            -e "s|^source=.*|source=(\"eleos-${pkgver}.tar.gz::${url}\")|" \
            packaging/arch/PKGBUILD

          docker run --rm \
            --volume "$PWD/packaging/arch:/src:ro" \
            archlinux:latest \
            bash -c '
              set -e
              id -u builder >/dev/null 2>&1 || useradd -m builder
              mkdir -p /home/builder/pkg
              cp /src/PKGBUILD /home/builder/pkg/
              chown -R builder /home/builder/pkg
              cd /home/builder/pkg
              runuser -u builder -- makepkg --printsrcinfo
            ' > packaging/arch/.SRCINFO

          # Keep the fallback version in the spec in sync. COPR tag builds
          # derive the real version from the tag in .copr/Makefile.
          sed -E -i "s/^Version:.*/Version:        ${pkgver}/" eleos.spec

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packaging/arch/PKGBUILD packaging/arch/.SRCINFO eleos.spec
          if git diff --cached --quiet; then
            echo "packaging metadata is already up to date"
            exit 0
          fi
          git commit -m "chore: update packaging for ${RELEASE_TAG} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

  apt:
    name: Publish package repositories
    needs:
      - release
      - arch
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check signing key
        id: key
        env:
          KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::APT_GPG_PRIVATE_KEY is not configured; skipping the package repository deployment"
          fi

      - name: Install tools
        if: steps.key.outputs.available == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils dpkg-dev gnupg

      - name: Collect packages
        if: steps.key.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p public/pool/main/e/eleos
          for tag in $(gh release list --limit 100 --json tagName -q '.[].tagName'); do
            gh release download "$tag" --pattern '*.deb' \
              --dir public/pool/main/e/eleos || true
          done
          ls -l public/pool/main/e/eleos

      - name: Collect Arch packages
        if: steps.key.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p public/pacman/pool
          for tag in $(gh release list --limit 100 --json tagName -q '.[].tagName'); do
            gh release download "$tag" \
              --pattern '*.pkg.tar.zst' \
              --pattern '*.pkg.tar.zst.sig' \
              --dir public/pacman/pool || true
          done
          shopt -s nullglob
          for file in public/pacman/pool/*; do
            case "$file" in
              *-x86_64.pkg.tar.zst*) arch=x86_64 ;;
              *-aarch64.pkg.tar.zst*) arch=aarch64 ;;
              *) continue ;;
            esac
            mkdir -p "public/pacman/$arch"
            mv "$file" "public/pacman/$arch/"
          done
          rm -rf public/pacman/pool

      - name: Generate pacman repository metadata
        if: steps.key.outputs.available == 'true'
        run: |
          for arch in x86_64 aarch64; do
            dir="public/pacman/$arch"
            [ -d "$dir" ] || continue
            shopt -s nullglob
            pkgs=("$dir"/*.pkg.tar.zst)
            shopt -u nullglob
            [ "${#pkgs[@]}" -gt 0 ] || continue

            echo "Generating pacman repository for $arch"
            # repo-add runs without --sign: the release key is passphrase
            # protected and repo-add cannot feed gpg a passphrase, so the
            # metadata is signed on the runner right after this step.
            docker run --rm \
              --volume "$PWD/$dir:/repo" \
              --workdir /repo \
              archlinux:latest \
              bash -c 'repo-add eleos.db.tar.gz ./*.pkg.tar.zst'
          done

      - name: Generate repository metadata
        if: steps.key.outputs.available == 'true'
        run: |
          cd public
          for arch in amd64 arm64; do
            mkdir -p "dists/stable/main/binary-$arch"
            dpkg-scanpackages --multiversion --arch "$arch" pool /dev/null \
              > "dists/stable/main/binary-$arch/Packages"
            gzip -9c "dists/stable/main/binary-$arch/Packages" \
              > "dists/stable/main/binary-$arch/Packages.gz"
          done
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin=eleos \
            -o APT::FTPArchive::Release::Label=eleos \
            -o APT::FTPArchive::Release::Suite=stable \
            -o APT::FTPArchive::Release::Codename=stable \
            -o APT::FTPArchive::Release::Architectures="amd64 arm64" \
            -o APT::FTPArchive::Release::Components=main \
            release dists/stable > dists/stable/Release

      - name: Sign repository
        if: steps.key.outputs.available == 'true'
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          cd public
          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          printf '%s' "$APT_GPG_PRIVATE_KEY" | gpg --batch --quiet --import

          GPG_OPTS=(--batch --yes --pinentry-mode loopback)
          if [ -n "${APT_GPG_PASSPHRASE:-}" ]; then
            GPG_OPTS+=(--passphrase "$APT_GPG_PASSPHRASE")
          fi

          keyid=$(gpg --list-secret-keys --with-colons |
            awk -F: '/^fpr:/{print $10; exit}')

          gpg "${GPG_OPTS[@]}" --clearsign \
            -o dists/stable/InRelease dists/stable/Release
          gpg "${GPG_OPTS[@]}" --armor --detach-sign \
            -o dists/stable/Release.gpg dists/stable/Release
          gpg --armor --export "$keyid" > eleos-archive-keyring.asc

          # pacman repository metadata and packages use the same signing key.
          mkdir -p pacman
          gpg --armor --export "$keyid" > pacman/eleos-archive-keyring.asc

          shopt -s nullglob
          for pkg in pacman/*/*.pkg.tar.zst; do
            [ -e "$pkg.sig" ] || gpg "${GPG_OPTS[@]}" --detach-sign -o "$pkg.sig" "$pkg"
          done

          for arch in x86_64 aarch64; do
            [ -d "pacman/$arch" ] || continue
            for db in eleos.db eleos.db.tar.gz eleos.files eleos.files.tar.gz; do
              [ -e "pacman/$arch/$db" ] || continue
              gpg "${GPG_OPTS[@]}" --detach-sign \
                -o "pacman/$arch/$db.sig" "pacman/$arch/$db"
            done
          done

          echo "ELEOS_KEY_FPR=$keyid" >> "$GITHUB_ENV"

      - name: Write index page
        if: steps.key.outputs.available == 'true'
        run: |
          cat > public/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head><meta charset="utf-8"><title>eleos package repositories</title></head>
          <body>
          <h1>eleos package repositories</h1>

          <h2>APT (Debian, Ubuntu, ...)</h2>
          <pre>
          curl -fsSL https://nexryai.github.io/eleos/eleos-archive-keyring.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/eleos-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/eleos-archive-keyring.gpg] https://nexryai.github.io/eleos/ stable main" \
            | sudo tee /etc/apt/sources.list.d/eleos.list
          sudo apt update
          sudo apt install eleos
          </pre>

          <h2>pacman (Arch Linux)</h2>
          <pre>
          curl -fsSL https://nexryai.github.io/eleos/pacman/eleos-archive-keyring.asc \
            -o /tmp/eleos-archive-keyring.asc
          sudo pacman-key --add /tmp/eleos-archive-keyring.asc
          sudo pacman-key --lsign-key __FPR__

          sudo tee -a /etc/pacman.conf >/dev/null <<'EOF'
          [eleos]
          SigLevel = Required DatabaseRequired
          Server = https://nexryai.github.io/eleos/pacman/$arch
          EOF

          sudo pacman -Syu
          sudo pacman -S eleos
          </pre>

          <p><a href="https://github.com/nexryai/eleos">nexryai/eleos</a></p>
          </body>
          </html>
          HTML
          sed -i "s/__FPR__/${ELEOS_KEY_FPR}/" public/index.html

      - name: Setup Pages
        if: steps.key.outputs.available == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.key.outputs.available == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        if: steps.key.outputs.available == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
